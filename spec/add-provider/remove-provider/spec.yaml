description: 删除 provider
steps:
- type: exec
  command: sumeru provider remove test-provider
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Removed provider
postcon:
- name: verify-removal
  steps:
  - type: exec
    command: sumeru provider get test-provider 2>&1; true
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: not found

description: 同时更新 prototype 多个字段
steps:
- type: exec
  command: |
    sumeru provider add update-provider --api-type openai --base-url https://api.update.com 2>/dev/null || true
    sumeru model add updated-model --provider update-provider --model updated-model-id 2>/dev/null || true
    sumeru prototype update test-proto --model updated-model --adapter hermes
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Updated prototype
postcon:
- name: verify-update
  steps:
  - type: exec
    command: sumeru prototype get test-proto --format json
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: updated-model|hermes

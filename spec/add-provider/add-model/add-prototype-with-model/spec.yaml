description: 基于 model 创建 prototype
primary: create-session
branches:
  - remove-prototype
  - update-multiple-fields
  - update-prototype
steps:
- type: exec
  command: sumeru prototype add test-proto --adapter sarsapa --model test-model --instructions "You are a helpful assistant"
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Created prototype
postcon:
- name: verify-prototype-exists
  steps:
  - type: exec
    command: sumeru prototype get test-proto --format json
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: '"name": "test-proto"'

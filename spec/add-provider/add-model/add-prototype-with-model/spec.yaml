description: 基于 model 创建 prototype
steps:
- type: exec
  command: sumeru persona add default --instructions "Default persona"
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Created persona
- type: exec
  command: sumeru prototype add test-proto --adapter sarsapa --model test-model
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Created prototype
postcon:
- name: verify-prototype-exists
  steps:
  - type: exec
    command: sumeru prototype get test-proto --format json
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: '"name": "test-proto"'

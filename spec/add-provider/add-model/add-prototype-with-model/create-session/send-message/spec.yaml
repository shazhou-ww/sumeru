description: 发送消息并等待回复
primary: send-append
steps:
- type: exec
  command: |
    . /app/spec/init-dind.sh
    export SID=$(sumeru session add test-proto --task 'Send test' 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1) && echo $SID > /tmp/send_session_id && echo SID=$SID
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: SID=ses_[A-Z0-9]+
- type: exec
  command: |
    SID=$(cat /tmp/send_session_id) && sumeru session send $SID 'What is 2+2?'
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Message sent|accepted message

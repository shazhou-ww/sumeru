description: 创建多个 sessions
primary: paginate-list
steps:
- type: exec
  command: |
    sumeru session add test-proto --task 'Test 2'
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: ses_[A-Z0-9]+
- type: exec
  command: sumeru session add test-proto --task 'Test 3'
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: .*

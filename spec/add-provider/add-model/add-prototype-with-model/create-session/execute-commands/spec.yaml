description: 执行 session 命令
steps:
- type: exec
  command: |
    export SID=$(sumeru session add test-proto --task 'Execute test' 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1) && echo $SID > /tmp/exec_session_id && echo SID=$SID
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: SID=ses_[A-Z0-9]+
- type: exec
  command: |
    SID=$(cat /tmp/exec_session_id) && sumeru session exec $SID -- echo test
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: test
- type: exec
  command: |
    SID=$(cat /tmp/exec_session_id) && sumeru session remove $SID || true
  assert:
    type: regex
    conditions:
    - path: stdout

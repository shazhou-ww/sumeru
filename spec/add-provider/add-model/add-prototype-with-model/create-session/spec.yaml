description: 创建一个 session
primary: send-message
steps:
- type: exec
  command: |
    docker load -qi /app/images/sarsapa.tar.gz 2>/dev/null || true
    export SID=$(sumeru session add test-proto --task 'Say hello' 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1) && echo SID=$SID && echo $SID > /tmp/session_id
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: SID=ses_[A-Z0-9]+
postcon:
- name: verify-session-exists
  steps:
  - type: exec
    command: |
      SID=$(cat /tmp/session_id)
      test -n "$SID" && echo "Session $SID created successfully"
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: .*

description: 创建无 task 的 session
primary: send-to-idle
steps:
- type: exec
  command: |
    . /app/spec/init-dind.sh
    export SID2=$(sumeru session add test-proto 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1) && echo SID2=$SID2 && echo $SID2 > /tmp/session_id_2
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: SID2=ses_[A-Z0-9]+

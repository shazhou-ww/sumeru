description: 保留 provider 被 model 引用
steps:
- type: exec
  command: sumeru model add ref-model --provider test-provider --model ref-id
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Created model
postcon:
- name: verify-model-exists
  steps:
  - type: exec
    command: sumeru model get ref-model --format json
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: '"name": "ref-model"'

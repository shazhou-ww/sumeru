description: 创建一个 model (依赖 provider 存在)
primary: add-prototype-with-model
steps:
- type: exec
  command: sumeru model add test-model --provider test-provider --model test-model-id
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Created model
postcon:
- name: verify-model-exists
  steps:
  - type: exec
    command: sumeru model get test-model --format json
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: '"name": "test-model"'

description: 删除运行中的 session
steps:
- type: exec
  command: |
    sumeru provider add test-provider --api-type openai --base-url https://api.example.com 2>/dev/null || true
    sumeru model add test-model --provider test-provider --model test-model-id 2>/dev/null || true
    sumeru prototype add test-proto --adapter sarsapa --model test-model --instructions "You are a helpful assistant" 2>/dev/null || true
    export SID=$(sumeru session add test-proto --task 'Count to 100' 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1) && echo SID=$SID && echo $SID > /tmp/dwr_session_id
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: SID=ses_[A-Z0-9]+
- type: exec
  command: |
    SID=$(cat /tmp/dwr_session_id) && sleep 2 && sumeru session remove $SID
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout

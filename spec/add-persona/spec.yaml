description: 创建一个 persona
steps:
- type: exec
  command: sumeru persona add test-persona --instructions 'You are a helpful assistant'
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Created persona
postcon:
- name: verify-persona-exists
  steps:
  - type: exec
    command: sumeru persona get test-persona --format json
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: '"name": "test-persona"'

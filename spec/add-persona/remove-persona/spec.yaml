description: 删除 persona
steps:
  - type: exec
    command: sumeru persona remove test-persona
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: Removed persona
postcon:
  - name: verify-removal
    steps:
      - type: exec
        command: sumeru persona get test-persona 2>&1; true
        assert:
          type: regex
          conditions:
            - path: stdout
              regex: not found

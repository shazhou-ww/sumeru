description: 删除带 persona 的 prototype
steps:
  - type: exec
    command: sumeru prototype remove proto-with-persona
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: Removed prototype
postcon:
  - name: verify-removal
    steps:
      - type: exec
        command: sumeru prototype get proto-with-persona 2>&1; true
        assert:
          type: regex
          conditions:
            - path: stdout
              regex: not found

description: 基于 persona 创建 prototype
steps:
- type: exec
  command: |
    # Ensure provider and model exist for the prototype
    sumeru provider add test-provider --api-type openai --base-url https://api.example.com 2>/dev/null || true
    sumeru model add test-model --provider test-provider --model test-model-id 2>/dev/null || true
    sumeru prototype add proto-with-persona --adapter sarsapa --model test-model --persona test-persona
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: Created prototype
postcon:
- name: verify-prototype-exists
  steps:
  - type: exec
    command: sumeru prototype get proto-with-persona --format json
    assert:
      type: regex
      conditions:
      - path: stdout
        regex: '"name": "proto-with-persona"'

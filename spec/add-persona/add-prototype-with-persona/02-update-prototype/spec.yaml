description: 更新带 persona 的 prototype
steps:
  - type: exec
    command: |
      sumeru provider add update-provider --api-type openai --base-url https://api.update.com 2>/dev/null || true
      sumeru model add update-model --provider update-provider --model update-model-id 2>/dev/null || true
      sumeru prototype update proto-with-persona --model update-model
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: Updated prototype
postcon:
  - name: verify-update
    steps:
      - type: exec
        command: sumeru prototype get proto-with-persona --format json
        assert:
          type: regex
          conditions:
            - path: stdout
              regex: update-model

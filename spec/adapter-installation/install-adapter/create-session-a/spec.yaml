description: Create session A from default prototype
primary: configure-snapshot-a
steps:
  - type: exec
    command: |
      PROTO="sarsapa-default"
      SID=$(sumeru session add $PROTO 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1)
      echo $SID > /tmp/session_a_id
      echo "SESSION_A=$SID PROTO=$PROTO"
    timeout: 5m
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: "SESSION_A=ses_[A-Z0-9]+"
postcon:
  - name: verify-session-a-exists
    steps:
      - type: exec
        command: |
          SID=$(cat /tmp/session_a_id)
          sumeru session get $SID --format json
        assert:
          type: regex
          conditions:
            - path: stdout
              regex: '"id":\s*"ses_[A-Z0-9]+"'

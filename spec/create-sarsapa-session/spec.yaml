description: 创建 sarsapa session 用于协议验证
steps:
- type: exec
  command: |
    sumeru persona add default --instructions "Default persona" 2>/dev/null || true
    sumeru provider add test-provider --api-type openai --base-url https://api.example.com 2>/dev/null || true
    sumeru model add test-model --provider test-provider --model test-model-id 2>/dev/null || true
    sumeru prototype add test-proto --adapter sarsapa --model test-model 2>/dev/null || true
    export SID=$(sumeru session add test-proto --task 'List the files in current directory' 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1) && echo SID=$SID && echo $SID > /tmp/sarsapa_session_id
  assert:
    type: regex
    conditions:
    - path: stdout
      regex: SID=ses_[A-Z0-9]+

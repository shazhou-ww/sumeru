description: "注入 secret code 到 session"
primary: take-sarsapa-snapshot
branches:
  - take-claude-code-snapshot
  - take-codex-snapshot
  - take-cursor-agent-snapshot
  - take-hermes-snapshot
steps:
  - command: |
      . /app/spec/init-dind.sh
      sumeru provider add test-provider --api-type openai --base-url https://api.example.com 2>/dev/null || true
      sumeru model add test-model --provider test-provider --model test-model-id 2>/dev/null || true
      sumeru prototype add test-proto --adapter sarsapa --model test-model --instructions "You are a helpful assistant" 2>/dev/null || true
      SID=$(sumeru session add test-proto --task "Remember this secret code: ALPHA-7742. Reply OK." 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1)
      echo $SID > /tmp/inject_session_id
      echo "SID=$SID"
    timeout: 5m
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: "SID=ses_[A-Z0-9]+"

description: "对 hermes session 创建 snapshot"
steps:
  - command: |
      sumeru provider add hermes-provider --api-type openai --base-url https://api.example.com 2>/dev/null || true
      sumeru model add hermes-model --provider hermes-provider --model hermes-3 2>/dev/null || true
      sumeru prototype add hermes-proto --adapter hermes --model hermes-model 2>/dev/null || true
      SID=$(sumeru session add hermes-proto --task "Remember secret: HERMES-3456. Reply OK." 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1)
      echo $SID > /tmp/hermes_session_id
      sumeru server start 2>&1 &
      sleep 3
      echo "Using SID: $SID"
      sumeru session snapshot $SID hermes-snapshot 2>&1
      echo "Exit code: $?"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: .*

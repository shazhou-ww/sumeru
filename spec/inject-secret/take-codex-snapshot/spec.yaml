description: "对 codex session 创建 snapshot"
steps:
  - command: |
      . /app/spec/init-dind.sh
      sumeru provider add openai-provider --api-type openai --base-url https://api.openai.com 2>/dev/null || true
      sumeru model add gpt-model --provider openai-provider --model gpt-4 2>/dev/null || true
      sumeru prototype add codex-proto --adapter codex --model gpt-model 2>/dev/null || true
      SID=$(sumeru session add codex-proto --task "Remember secret: CODEX-5678. Reply OK." 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1)
      echo $SID > /tmp/codex_session_id
      sumeru server start 2>&1 &
      sleep 3
      echo "Using SID: $SID"
      sumeru session snapshot $SID codex-snapshot 2>&1
      echo "Exit code: $?"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: "Snapshot created|Exit code: 0"

description: "对 sarsapa session 创建 snapshot"
steps:
  - command: |
      sumeru server start 2>&1 &
      sleep 3
      SID=$(cat /tmp/inject_session_id)
      echo "Using SID: $SID"
      sumeru session snapshot $SID sarsapa-snapshot 2>&1
      echo "Exit code: $?"
    timeout: "120s"
    assert:
      type: regex
      conditions:
        - path: stdout
          regex: .*

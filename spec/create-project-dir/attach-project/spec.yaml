description: 创建带项目目录的 session
primary: read-project-file
steps:
- type: exec
  command: |
    sumeru provider add test-provider --api-type openai --base-url https://api.example.com 2>/dev/null || true
    sumeru model add test-model --provider test-provider --model test-model-id 2>/dev/null || true
    sumeru prototype add test-proto --adapter sarsapa --model test-model --instructions "You are a helpful assistant" 2>/dev/null || true
    export SID=$(sumeru session add test-proto --project test-project --task 'Read the project file' 2>&1 | grep -o 'ses_[A-Z0-9]*' | head -1) && echo SID=$SID && echo $SID > /tmp/project_session_id
  timeout: 5m
  assert:
    type: regex
    conditions:
    - path: stdout
